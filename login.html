<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - JadwalKu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

<div class="login-box">
    <div class="login-logo">
        <i class="fas fa-calendar-alt"></i>
    </div>
    <h1>JadwalKu</h1>
    <p>Masuk untuk melanjutkan</p>

    <div class="login-error" id="loginError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="loginErrorMsg">Terjadi kesalahan</span>
    </div>

    <form onsubmit="handleLogin(event)">
        <div class="wp-form-group">
            <label class="wp-form-label">
                <i class="fas fa-user" style="color:var(--primary);margin-right:6px;"></i>
                Username
            </label>
            <input
                type="text"
                class="wp-input"
                id="loginUsername"
                required
                placeholder="Masukkan username"
                autocomplete="username"
                autofocus
            >
        </div>

        <div class="wp-form-group">
            <label class="wp-form-label">
                <i class="fas fa-school" style="color:var(--primary);margin-right:6px;"></i>
                Kelas
            </label>
            <input
                type="text"
                class="wp-input"
                id="loginKelas"
                placeholder="Contoh: XI IPA 1"
                autocomplete="off"
            >
        </div>

        <button type="submit" class="wp-btn wp-btn-primary" style="width:100%;margin-top:8px;min-height:44px;">
            <i class="fas fa-sign-in-alt"></i>
            <span>Masuk</span>
        </button>
    </form>

    <div class="login-hint">
        <i class="fas fa-info-circle"></i>
        Demo: isi username apa saja untuk masuk
    </div>
</div>

<script src="config.js"></script>
<script>
    /* Redirect jika sudah login */
    (function checkExistingSession() {
        try {
            const stored = localStorage.getItem(AUTH_CONFIG.storageKey);
            if (stored) {
                const user = JSON.parse(stored);
                if (user && user.username) {
                    window.location.replace(AUTH_CONFIG.homePage);
                }
            }
        } catch (e) { /* ignore */ }
    })();

    function showLoginError(msg) {
        const err = document.getElementById('loginError');
        const msgEl = document.getElementById('loginErrorMsg');
        if (err && msgEl) {
            msgEl.textContent = msg;
            err.classList.add('show');
            setTimeout(() => err.classList.remove('show'), 3000);
        }
    }

    function handleLogin(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('loginUsername');
        const kelasInput = document.getElementById('loginKelas');

        const username = usernameInput.value.trim();
        const kelas = kelasInput.value.trim() || 'XI IPA 1';

        if (!username) {
            showLoginError('Username wajib diisi');
            usernameInput.focus();
            return;
        }

        if (username.length < 3) {
            showLoginError('Username minimal 3 karakter');
            usernameInput.focus();
            return;
        }

        // Buat objek user
        const user = {
            username: username.toLowerCase().replace(/\s+/g, '_'),
            name: username,
            kelas: kelas,
            role: 'Siswa',
            loginAt: new Date().toISOString()
        };

        try {
            // Simpan sesi
            localStorage.setItem(AUTH_CONFIG.storageKey, JSON.stringify(user));

            // Animasi keluar
            document.querySelector('.login-box').style.transition = 'all 0.4s ease';
            document.querySelector('.login-box').style.opacity = '0';
            document.querySelector('.login-box').style.transform = 'translateY(-20px) scale(0.95)';

            // Redirect ke dashboard
            setTimeout(() => {
                window.location.replace(AUTH_CONFIG.homePage);
            }, 400);

        } catch (err) {
            console.error('Login error:', err);
            showLoginError('Gagal menyimpan sesi: ' + err.message);
        }
    }

    // Enter key pada input kelas → submit
    document.getElementById('loginKelas').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.querySelector('form').requestSubmit();
        }
    });
</script>
</body>
</html>
